<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <rect width="800" height="420" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Left Side: Domain Name Signpost -->
  <rect x="36" y="36" width="340" height="348" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="66" y="64" width="280" height="58" rx="12" fill="#2563EB"/>
  <text x="206" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Prompt, sans-serif" font-size="16" font-weight="700">🌐 ชื่อโดเมน (Domain Name)</text>
  <text x="206" y="111" text-anchor="middle" fill="#BFDBFE" font-family="Inter, sans-serif" font-size="13" font-weight="600">www.baanhomdessert.com</text>

  <!-- Signpost Pole -->
  <rect x="198" y="122" width="16" height="90" fill="#1E40AF"/>
  <rect x="146" y="206" width="120" height="16" rx="8" fill="#1E3A8A"/>

  <text x="206" y="256" text-anchor="middle" fill="#1E3A8A" font-family="Prompt, sans-serif" font-size="20" font-weight="700">เปรียบเหมือน "ป้ายชื่อร้าน &amp; ที่อยู่"</text>
  <text x="206" y="286" text-anchor="middle" fill="#334155" font-family="Prompt, sans-serif" font-size="15">ช่วยให้ลูกค้าจดจำชื่อร้านได้ง่าย</text>
  <text x="206" y="310" text-anchor="middle" fill="#334155" font-family="Prompt, sans-serif" font-size="15">ไม่ต้องจำเลข IP Address ที่ซับซ้อน</text>
  <rect x="76" y="330" width="260" height="34" rx="8" fill="#DBEAFE"/>
  <text x="206" y="352" text-anchor="middle" fill="#1D4ED8" font-family="Prompt, sans-serif" font-size="13" font-weight="700">แต่มีแค่ป้ายชื่อ... ยังไม่มีที่วางสินค้า!</text>

  <!-- Plus / Connector -->
  <circle cx="400" cy="210" r="24" fill="#8B5CF6"/>
  <text x="400" y="218" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="26" font-weight="800">+</text>

  <!-- Right Side: Web Hosting Building -->
  <rect x="424" y="36" width="340" height="348" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <!-- Storefront Roof -->
  <path d="M464 115 L594 56 L724 115 Z" fill="#7C3AED"/>
  <rect x="484" y="115" width="220" height="105" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
  <!-- Shelves / Files inside building -->
  <rect x="502" y="130" width="54" height="34" rx="5" fill="#EDE9FE" stroke="#8B5CF6"/>
  <text x="529" y="151" text-anchor="middle" fill="#6D28D9" font-family="Inter, sans-serif" font-size="11" font-weight="700">HTML</text>
  <rect x="567" y="130" width="54" height="34" rx="5" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="594" y="151" text-anchor="middle" fill="#1D4ED8" font-family="Inter, sans-serif" font-size="11" font-weight="700">Images</text>
  <rect x="632" y="130" width="54" height="34" rx="5" fill="#D1FAE5" stroke="#059669"/>
  <text x="659" y="151" text-anchor="middle" fill="#047857" font-family="Inter, sans-serif" font-size="11" font-weight="700">DB / Video</text>
  <rect x="502" y="174" width="184" height="32" rx="6" fill="#0F172A"/>
  <text x="594" y="195" text-anchor="middle" fill="#22D3EE" font-family="Prompt, sans-serif" font-size="12" font-weight="600">🗄️ พื้นที่เซิร์ฟเวอร์ (Web Hosting)</text>

  <text x="594" y="256" text-anchor="middle" fill="#4C1D95" font-family="Prompt, sans-serif" font-size="20" font-weight="700">เปรียบเหมือน "ที่ดิน &amp; อาคารร้านค้า"</text>
  <text x="594" y="286" text-anchor="middle" fill="#334155" font-family="Prompt, sans-serif" font-size="15">ใช้จัดเก็บไฟล์ HTML รูปภาพ วิดีโอ</text>
  <text x="594" y="310" text-anchor="middle" fill="#334155" font-family="Prompt, sans-serif" font-size="15">และฐานข้อมูลสินค้าให้พร้อมเปิด 24 ชม.</text>
  <rect x="464" y="330" width="260" height="34" rx="8" fill="#EDE9FE"/>
  <text x="594" y="352" text-anchor="middle" fill="#6D28D9" font-family="Prompt, sans-serif" font-size="13" font-weight="700">มีทั้งป้ายชื่อ + พื้นที่ร้าน = เว็บพร้อมใช้งาน!</text>
</svg>
