  <rect x="556" y="308" width="163" height="52" rx="8" fill="#1E293B"/>
  <circle cx="582" cy="334" r="14" fill="#22D3EE" opacity="0.25"/>
  <text x="606" y="331" fill="#F8FAFC" font-family="Prompt, sans-serif" font-size="12" font-weight="600">ชำระเงินปลอดภัย</text>
  <text x="606" y="348" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="11">HTTPS / TLS Encrypted</text>
