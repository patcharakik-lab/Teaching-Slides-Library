  <text x="104" y="348" fill="#F8FAFC" font-family="Prompt, sans-serif" font-size="13" font-weight="600">สินค้าขายดี #1</text>
  <text x="104" y="368" fill="#22D3EE" font-family="Prompt, sans-serif" font-size="12" font-weight="700">฿ 290.-</text>

  <rect x="256" y="252" width="148" height="132" rx="10" fill="#1E293B" stroke="#334155"/>
