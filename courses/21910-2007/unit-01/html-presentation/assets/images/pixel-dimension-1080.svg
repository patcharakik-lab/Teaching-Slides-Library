<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="22" fill="#0F172A"/>
  <!-- Left: 1080x1080 Square Canvas -->
  <rect x="45" y="55" width="340" height="340" rx="16" fill="#1E293B" stroke="#22D3EE" stroke-width="3"/>
  <!-- Grid lines inside square -->
  <line x1="158" y1="55" x2="158" y2="395" stroke="#334155" stroke-dasharray="6 6"/>
  <line x1="271" y1="55" x2="271" y2="395" stroke="#334155" stroke-dasharray="6 6"/>
  <line x1="45" y1="168" x2="385" y2="168" stroke="#334155" stroke-dasharray="6 6"/>
  <line x1="45" y1="281" x2="385" y2="281" stroke="#334155" stroke-dasharray="6 6"/>

  <rect x="95" y="135" width="240" height="175" rx="14" fill="#0B1026" stroke="#38BDF8" stroke-width="2"/>
  <text x="215" y="185" text-anchor="middle" fill="#22D3EE" font-family="Prompt, Inter, sans-serif" font-size="28" font-weight="800">1080 × 1080 px</text>
  <text x="215" y="222" text-anchor="middle" fill="#F8FAFC" font-family="Prompt, sans-serif" font-size="20" font-weight="600">สัดส่วน 1:1 (จัตุรัส)</text>
  <text x="215" y="258" text-anchor="middle" fill="#FDE047" font-family="Prompt, sans-serif" font-size="18" font-weight="700">พื้นที่รวม 1,166,400 พิกเซล</text>
  <text x="215" y="288" text-anchor="middle" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="15">(1,080 × 1,080 จุดสีเรียงต่อกัน)</text>

  <!-- Width & Height labels -->
  <text x="215" y="40" text-anchor="middle" fill="#38BDF8" font-family="Prompt, sans-serif" font-size="20" font-weight="700">← ความกว้าง (Width) = 1,080 px →</text>
  <text x="215" y="435" text-anchor="middle" fill="#CBD5E1" font-family="Prompt, sans-serif" font-size="18">เหมาะสำหรับโพสต์ภาพสินค้า Facebook / Instagram</text>

  <!-- Right: Aspect Ratio Comparison (1:1, 4:5, 16:9, 9:16) -->
  <g transform="translate(430, 48)">
    <text x="0" y="26" fill="#FFFFFF" font-family="Prompt, sans-serif" font-size="22" font-weight="700">สัดส่วนภาพ (Aspect Ratio) ยอดนิยม</text>

    <!-- 1:1 -->
    <rect x="0" y="48" width="155" height="155" rx="12" fill="#1E293B" stroke="#22D3EE" stroke-width="2.5"/>
    <text x="77" y="115" text-anchor="middle" fill="#22D3EE" font-family="Inter, sans-serif" font-size="26" font-weight="800">1 : 1</text>
    <text x="77" y="145" text-anchor="middle" fill="#F8FAFC" font-family="Prompt, sans-serif" font-size="15">1080 × 1080 px</text>
    <text x="77" y="170" text-anchor="middle" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="14">โพสต์สินค้าจัตุรัส</text>

    <!-- 4:5 -->
    <rect x="180" y="48" width="145" height="175" rx="12" fill="#1E293B" stroke="#C084FC" stroke-width="2.5"/>
    <text x="252" y="122" text-anchor="middle" fill="#C084FC" font-family="Inter, sans-serif" font-size="26" font-weight="800">4 : 5</text>
    <text x="252" y="152" text-anchor="middle" fill="#F8FAFC" font-family="Prompt, sans-serif" font-size="15">1080 × 1350 px</text>
    <text x="252" y="177" text-anchor="middle" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="14">โพสต์ภาพแนวตั้ง</text>

    <!-- 16:9 -->
    <rect x="0" y="245" width="195" height="115" rx="12" fill="#1E293B" stroke="#34D399" stroke-width="2.5"/>
    <text x="97" y="295" text-anchor="middle" fill="#34D399" font-family="Inter, sans-serif" font-size="24" font-weight="800">16 : 9</text>
    <text x="97" y="322" text-anchor="middle" fill="#F8FAFC" font-family="Prompt, sans-serif" font-size="15">1920 × 1080 px</text>
    <text x="97" y="344" text-anchor="middle" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="14">สไลด์ / วิดีโอแนวนอน</text>

    <!-- 9:16 -->
    <rect x="215" y="235" width="110" height="170" rx="12" fill="#1E293B" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="270" y="305" text-anchor="middle" fill="#FBBF24" font-family="Inter, sans-serif" font-size="24" font-weight="800">9 : 16</text>
    <text x="270" y="332" text-anchor="middle" fill="#F8FAFC" font-family="Prompt, sans-serif" font-size="14">1080×1920</text>
    <text x="270" y="356" text-anchor="middle" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="13">Story / TikTok</text>
  </g>
</svg>
