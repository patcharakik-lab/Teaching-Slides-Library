<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" fill="none">
  <rect width="860" height="440" rx="24" fill="#F8FAFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-family="Prompt, sans-serif" font-size="20" font-weight="700" fill="#18243D">ผ่าโครงสร้าง URL สมมติ &amp; เปรียบเทียบกับร้านกาแฟจริง</text>

  <!-- Full URL Bar -->
  <g transform="translate(40, 56)">
    <rect width="780" height="66" rx="16" fill="#FFFFFF" stroke="#4778F5" stroke-width="2.5"/>
    <rect x="16" y="12" width="140" height="42" rx="10" fill="#D5F5E8" stroke="#10B981" stroke-width="1.5"/>
    <text x="86" y="39" text-anchor="middle" font-family="Inter, monospace" font-size="21" font-weight="800" fill="#065F46">https://</text>

    <rect x="166" y="12" width="380" height="42" rx="10" fill="#DDEBFF" stroke="#4778F5" stroke-width="1.5"/>
    <text x="356" y="39" text-anchor="middle" font-family="Inter, monospace" font-size="21" font-weight="800" fill="#1E40AF">www.baancoffee.example</text>

    <rect x="556" y="12" width="208" height="42" rx="10" fill="#EDE5FF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="660" y="39" text-anchor="middle" font-family="Inter, monospace" font-size="21" font-weight="800" fill="#5B21B6">/menu</text>
  </g>

  <!-- 4 Cards Mapping -->
  <g transform="translate(40, 146)">
    <!-- HTTPS -->
    <rect x="0" y="0" width="183" height="264" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="14" y="14" width="155" height="40" rx="10" fill="#D5F5E8"/>
    <text x="91" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#065F46">🔒 HTTPS (TLS)</text>
    <text x="91" y="80" text-anchor="middle" font-family="Prompt, sans-serif" font-size="14.5" font-weight="700" fill="#18243D">การเชื่อมต่อเข้ารหัส</text>
    <text x="91" y="106" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" fill="#52627D">ปกป้องชื่อ เบอร์โทร ที่อยู่</text>
    <text x="91" y="126" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" fill="#52627D">และคำสั่งซื้อระหว่างรับส่ง</text>
    <rect x="14" y="154" width="155" height="94" rx="10" fill="#F0FDF4"/>
    <text x="91" y="178" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" font-weight="700" fill="#047857">เปรียบเหมือน:</text>
    <text x="91" y="200" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" fill="#065F46">ระบบรักษาความปลอดภัย</text>
    <text x="91" y="220" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" fill="#065F46">และซองปิดผนึกข้อมูลลูกค้า</text>

    <!-- Domain -->
    <rect x="199" y="0" width="183" height="264" rx="16" fill="#FFFFFF" stroke="#4778F5" stroke-width="2"/>
    <rect x="213" y="14" width="155" height="40" rx="10" fill="#DDEBFF"/>
    <text x="290" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#1E40AF">🏷️ Domain</text>
    <text x="290" y="80" text-anchor="middle" font-family="Prompt, sans-serif" font-size="14.5" font-weight="700" fill="#18243D">ชื่อที่ใช้จดจำและเข้าถึง</text>
    <text x="290" y="106" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" fill="#52627D">ชื่อโฮสต์ baancoffee</text>
    <text x="290" y="126" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" fill="#52627D">ช่วยให้จำง่ายแทนเลข IP</text>
    <rect x="213" y="154" width="155" height="94" rx="10" fill="#EFF6FF"/>
    <text x="290" y="178" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" font-weight="700" fill="#1D4ED8">เปรียบเหมือน:</text>
    <text x="290" y="200" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" fill="#1E40AF">ป้ายชื่อร้านกาแฟ</text>
    <text x="290" y="220" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" fill="#1E40AF">ที่ลูกค้าจำและบอกต่อได้ทันที</text>

    <!-- URL & Path -->
    <rect x="398" y="0" width="183" height="264" rx="16" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="412" y="14" width="155" height="40" rx="10" fill="#EDE5FF"/>
    <text x="489" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#5B21B6">🧭 URL (/menu)</text>
    <text x="489" y="80" text-anchor="middle" font-family="Prompt, sans-serif" font-size="14.5" font-weight="700" fill="#18243D">ที่อยู่ระบุหน้าเว็บ/ทรัพยากร</text>
    <text x="489" y="106" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" fill="#52627D">/menu คือเส้นทางนำทาง</text>
    <text x="489" y="126" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" fill="#52627D">ไปยังหน้าเมนูเครื่องดื่ม</text>
    <rect x="412" y="154" width="155" height="94" rx="10" fill="#F5F3FF"/>
    <text x="489" y="178" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" font-weight="700" fill="#6D28D9">เปรียบเหมือน:</text>
    <text x="489" y="200" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" fill="#5B21B6">ที่อยู่เต็ม + ป้ายบอกโซน</text>
    <text x="489" y="220" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" fill="#5B21B6">เดินตรงไปที่บอร์ดเมนูทันที</text>

    <!-- Hosting -->
    <rect x="597" y="0" width="183" height="264" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="611" y="14" width="155" height="40" rx="10" fill="#FEF3C7"/>
    <text x="688" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#B45309">🏢 Hosting</text>
    <text x="688" y="80" text-anchor="middle" font-family="Prompt, sans-serif" font-size="14.5" font-weight="700" fill="#18243D">พื้นที่และทรัพยากรเว็บ</text>
    <text x="688" y="106" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" fill="#52627D">รองรับการจัดเก็บไฟล์เว็บ</text>
    <text x="688" y="126" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" fill="#52627D">รูปภาพ และข้อมูลเมนูทั้งหมด</text>
    <rect x="611" y="154" width="155" height="94" rx="10" fill="#FFFBEB"/>
    <text x="688" y="178" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" font-weight="700" fill="#B45309">เปรียบเหมือน:</text>
    <text x="688" y="200" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" fill="#92400E">ที่ดินและอาคารร้านกาแฟ</text>
    <text x="688" y="220" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" fill="#92400E">ที่ตั้งเคาน์เตอร์และเก็บสินค้า</text>
  </g>
</svg>