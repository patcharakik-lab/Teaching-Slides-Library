  <text x="606" y="412" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="11">ออนไลน์ 24 ชั่วโมง</text>
  <rect x="556" y="438" width="163" height="34" rx="17" fill="#22D3EE"/>
  <text x="600" y="460" fill="#0B1026" font-family="Prompt, sans-serif" font-size="13" font-weight="700">สั่งซื้อทันที</text>

  <!-- Floating Cloud & Server Badge -->
  <rect x="55" y="430" width="440" height="72" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="100" cy="466" r="22" fill="#8B5CF6" opacity="0.25"/>
  <text x="90" y="473" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="18" font-weight="700">⚡</text>
  <text x="136" y="460" fill="#FFFFFF" font-family="Prompt, sans-serif" font-size="16" font-weight="700">Web Architecture: Domain + Hosting + Server + HTTPS</text>
  <text x="136" y="483" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="13">พื้นฐานสำคัญสู่การเป็นนักพัฒนาเว็บไซต์ธุรกิจดิจิทัลมืออาชีพ</text>
</svg>
