<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" rx="18" fill="#0F172A"/>
  <!-- Browser Frame -->
  <rect x="24" y="20" width="752" height="410" rx="14" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
  <rect x="24" y="20" width="752" height="40" rx="14" fill="#1E293B"/>
  <circle cx="48" cy="40" r="6" fill="#F43F5E"/>
  <circle cx="68" cy="40" r="6" fill="#F59E0B"/>
  <circle cx="88" cy="40" r="6" fill="#10B981"/>
  <rect x="120" y="28" width="440" height="24" rx="12" fill="#0F172A"/>
  <text x="140" y="44" fill="#34D399" font-family="Inter, sans-serif" font-size="12" font-weight="600">🔒 https://baan-coffee.example</text>

  <!-- Header & Nav -->
  <rect x="40" y="72" width="720" height="46" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
