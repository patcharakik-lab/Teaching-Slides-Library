<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF4FF"/>
      <stop offset="50%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#E6FAF2"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4778F5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Left: Laptop Browser Showing Baan Phrae Coffee Website -->
  <g transform="translate(36, 56)">
    <rect x="0" y="0" width="330" height="230" rx="16" fill="#FFFFFF" stroke="#4778F5" stroke-width="3"/>
    <rect x="0" y="0" width="330" height="36" rx="16" fill="#4778F5"/>
    <circle cx="20" cy="18" r="5" fill="#FCA5A5"/>
    <circle cx="36" cy="18" r="5" fill="#FDE68A"/>
    <circle cx="52" cy="18" r="5" fill="#6EE7B7"/>
    <rect x="72" y="8" width="240" height="20" rx="10" fill="#FFFFFF"/>
    <text x="84" y="22" font-family="Inter, Prompt, sans-serif" font-size="11" font-weight="700" fill="#18243D">🔒 https://www.baancoffee.example/menu</text>

    <!-- Storefront Header & Hero -->
    <rect x="16" y="48" width="298" height="30" rx="8" fill="#DDEBFF"/>
    <text x="28" y="68" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#1E40AF">☕ บ้านกาแฟแพร่ (Baan Coffee)</text>
    <text x="215" y="68" font-family="Prompt, sans-serif" font-size="11" font-weight="600" fill="#4778F5">หน้าแรก | เมนู | ติดต่อ</text>

    <!-- Product Cards -->
    <rect x="16" y="88" width="142" height="124" rx="10" fill="#F8FAFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="28" y="98" width="118" height="52" rx="8" fill="#EDE5FF"/>
    <text x="87" y="130" text-anchor="middle" font-family="Prompt, sans-serif" font-size="22">🧋</text>
    <text x="87" y="168" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#18243D">อเมริกาโน่น้ำผึ้ง</text>
    <rect x="38" y="178" width="98" height="24" rx="6" fill="#4778F5"/>
    <text x="87" y="194" text-anchor="middle" font-family="Prompt, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">สั่งซื้อ 50 ฿</text>

    <rect x="172" y="88" width="142" height="124" rx="10" fill="#F8FAFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <rect x="184" y="98" width="118" height="52" rx="8" fill="#D5F5E8"/>
    <text x="243" y="130" text-anchor="middle" font-family="Prompt, sans-serif" font-size="22">🍵</text>
    <text x="243" y="168" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#18243D">มัทฉะลาเต้เย็น</text>
    <rect x="194" y="178" width="98" height="24" rx="6" fill="#8B5CF6"/>
    <text x="243" y="194" text-anchor="middle" font-family="Prompt, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">สั่งซื้อ 55 ฿</text>

    <!-- Laptop Base -->
    <path d="M-14 230 H344 L330 248 H0 Z" fill="#94A3B8"/>
    <rect x="115" y="256" width="100" height="28" rx="14" fill="#18243D"/>
    <text x="165" y="275" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Web Browser</text>
  </g>

  <!-- Center: Request & Response Arrows + DNS -->
  <g transform="translate(382, 85)">
    <rect x="10" y="0" width="128" height="54" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <text x="74" y="23" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#6D28D9">1. DNS ค้นหา IP</text>
    <text x="74" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#52627D">203.0.113.25</text>

    <!-- Request Arrow -->
    <path d="M0 95 H135" stroke="#4778F5" stroke-width="4" stroke-linecap="round"/>
    <polygon points="135,87 150,95 135,103" fill="#4778F5"/>
    <rect x="12" y="66" width="124" height="24" rx="8" fill="#4778F5"/>
    <text x="74" y="82" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2. ส่งคำขอ (Request)</text>

    <!-- Response Arrow -->
    <path d="M150 155 H15" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <polygon points="15,147 0,155 15,163" fill="#10B981"/>
    <rect x="12" y="168" width="124" height="24" rx="8" fill="#10B981"/>
    <text x="74" y="184" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4. ส่งกลับ (Response)</text>
  </g>

  <!-- Right: Web Server + Hosting + Database -->
  <g transform="translate(546, 56)">
    <rect x="0" y="0" width="218" height="230" rx="18" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <rect x="18" y="18" width="182" height="44" rx="10" fill="#18243D"/>
    <circle cx="38" cy="40" r="6" fill="#34D399"/>
    <circle cx="56" cy="40" r="6" fill="#38BDF8"/>
    <text x="126" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">WEB SERVER</text>

    <rect x="18" y="74" width="182" height="44" rx="10" fill="#DDEBFF" stroke="#4778F5" stroke-width="1.5"/>
    <text x="109" y="94" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#1E40AF">3. ประมวลผลคำขอ</text>
    <text x="109" y="111" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569">HTML • CSS • JS • Images</text>

    <rect x="18" y="130" width="182" height="82" rx="12" fill="#EDE5FF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="109" y="154" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#5B21B6">🗄️ Web Hosting &amp; DB</text>
    <text x="109" y="175" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12" fill="#475569">เก็บไฟล์เว็บ รูปเมนูสินค้า</text>
    <text x="109" y="195" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12" fill="#475569">และฐานข้อมูลคำสั่งซื้อ</text>

    <rect x="44" y="256" width="130" height="28" rx="14" fill="#059669"/>
    <text x="109" y="275" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Web Server</text>
  </g>

  <!-- Bottom Summary Banner: Website Analysis Pillars -->
  <g transform="translate(36, 360)">
    <rect x="0" y="0" width="728" height="106" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="364" y="30" text-anchor="middle" font-family="Prompt, sans-serif" font-size="16" font-weight="700" fill="#18243D">เป้าหมายการเรียนรู้สัปดาห์ที่ 2: เข้าใจการทำงานเบื้องหลัง + วิเคราะห์คุณภาพเว็บไซต์ธุรกิจได้จริง</text>
    
    <rect x="20" y="44" width="162" height="46" rx="10" fill="#DDEBFF"/>
    <text x="101" y="72" text-anchor="middle" font-family="Prompt, sans-serif" font-size="14" font-weight="700" fill="#1E40AF">1. Browser ↔ Server</text>

    <rect x="195" y="44" width="162" height="46" rx="10" fill="#EDE5FF"/>
    <text x="276" y="72" text-anchor="middle" font-family="Prompt, sans-serif" font-size="14" font-weight="700" fill="#5B21B6">2. URL &amp; HTTPS</text>

    <rect x="370" y="44" width="162" height="46" rx="10" fill="#D5F5E8"/>
    <text x="451" y="72" text-anchor="middle" font-family="Prompt, sans-serif" font-size="14" font-weight="700" fill="#065F46">3. เว็บข้อมูล vs เว็บแอป</text>

    <rect x="545" y="44" width="163" height="46" rx="10" fill="#FEF3C7"/>
    <text x="626" y="72" text-anchor="middle" font-family="Prompt, sans-serif" font-size="14" font-weight="700" fill="#92400E">4. วิเคราะห์ 7 องค์ประกอบ</text>
  </g>
</svg>