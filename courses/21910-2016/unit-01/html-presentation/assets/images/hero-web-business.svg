  <rect x="92" y="116" width="476" height="120" rx="12" fill="url(#cyanGlow)" opacity="0.9"/>
  <text x="116" y="158" fill="#FFFFFF" font-family="Prompt, sans-serif" font-size="22" font-weight="700">หน้าร้านธุรกิจดิจิทัล 24 ชั่วโมง</text>
  <text x="116" y="186" fill="#E0F2FE" font-family="Prompt, sans-serif" font-size="14">เชื่อมต่อลูกค้าทั่วโลกด้วยเว็บไซต์ที่ทันสมัย ปลอดภัย และใช้งานง่าย</text>
