<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="820" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B1026"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="goldWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="820" height="680" rx="28" fill="url(#cardBg)"/>
  <circle cx="680" cy="120" r="140" fill="#8B5CF6" fill-opacity="0.18"/>
  <circle cx="140" cy="540" r="160" fill="#22D3EE" fill-opacity="0.14"/>

  <!-- Main Design Studio Monitor Frame -->
  <rect x="55" y="48" width="710" height="450" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
  <rect x="55" y="48" width="710" height="44" rx="20" fill="#0F172A"/>
  <circle cx="85" cy="70" r="7" fill="#F43F5E"/>
  <circle cx="107" cy="70" r="7" fill="#FBBF24"/>
  <circle cx="129" cy="70" r="7" fill="#10B981"/>
  <text x="160" y="76" fill="#E2E8F0" font-family="Prompt, Inter, sans-serif" font-size="16" font-weight="600">Digital Graphics Studio — 1080 × 1080 px (RGB / 300 PPI)</text>

  <!-- Left Toolbar -->
  <rect x="75" y="110" width="58" height="365" rx="12" fill="#0F172A" stroke="#334155"/>
  <rect x="87" y="125" width="34" height="34" rx="8" fill="#2563EB"/>
  <path d="M97 149L104 132L111 149L104 145L97 149Z" fill="#FFFFFF"/>
  <rect x="87" y="172" width="34" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
  <circle cx="104" cy="189" r="9" stroke="#22D3EE" stroke-width="2.5"/>
  <rect x="87" y="219" width="34" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
  <rect x="95" y="227" width="18" height="18" rx="3" stroke="#C084FC" stroke-width="2.5"/>
  <rect x="87" y="266" width="34" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="97" y="290" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="20" font-weight="800">T</text>

  <!-- Center Split Canvas: Raster Pixel Grid vs Vector Bezier -->
  <rect x="150" y="110" width="420" height="365" rx="14" fill="#090D16" stroke="#475569" stroke-width="2"/>

  <!-- Left Half: Raster Pixel Grid -->
  <g transform="translate(168, 128)">
    <rect width="185" height="230" rx="10" fill="#111827" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="16" y="28" fill="#22D3EE" font-family="Prompt, Inter, sans-serif" font-size="16" font-weight="700">1. RASTER (Pixel)</text>
    <!-- Pixel Blocks -->
    <g transform="translate(22, 45)">
      <rect x="0" y="0" width="26" height="26" fill="#F43F5E"/>
      <rect x="28" y="0" width="26" height="26" fill="#FB7185"/>
      <rect x="56" y="0" width="26" height="26" fill="#FDE047"/>
      <rect x="84" y="0" width="26" height="26" fill="#F59E0B"/>
      <rect x="112" y="0" width="26" height="26" fill="#10B981"/>

      <rect x="0" y="28" width="26" height="26" fill="#EC4899"/>
      <rect x="28" y="28" width="26" height="26" fill="#F43F5E"/>
      <rect x="56" y="28" width="26" height="26" fill="#FBBF24"/>
      <rect x="84" y="28" width="26" height="26" fill="#34D399"/>
      <rect x="112" y="28" width="26" height="26" fill="#059669"/>

      <rect x="0" y="56" width="26" height="26" fill="#A855F7"/>
      <rect x="28" y="56" width="26" height="26" fill="#EC4899"/>
      <rect x="56" y="56" width="26" height="26" fill="#38BDF8"/>
      <rect x="84" y="56" width="26" height="26" fill="#22D3EE"/>
      <rect x="112" y="56" width="26" height="26" fill="#0284C7"/>

      <rect x="0" y="84" width="26" height="26" fill="#6366F1"/>
      <rect x="28" y="84" width="26" height="26" fill="#8B5CF6"/>
      <rect x="56" y="84" width="26" height="26" fill="#2563EB"/>
      <rect x="84" y="84" width="26" height="26" fill="#3B82F6"/>
      <rect x="112" y="84" width="26" height="26" fill="#1D4ED8"/>
    </g>
    <text x="16" y="185" fill="#CBD5E1" font-family="Prompt, sans-serif" font-size="14">• ภาพถ่ายสินค้า / อาหาร</text>
    <text x="16" y="208" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="13.5">• ขยายเกินขนาดอาจเบลอ</text>
  </g>

  <!-- Right Half: Vector Bezier Curve & Logo -->
  <g transform="translate(367, 128)">
    <rect width="185" height="230" rx="10" fill="#111827" stroke="#C084FC" stroke-width="1.5"/>
    <text x="16" y="28" fill="#C084FC" font-family="Prompt, Inter, sans-serif" font-size="16" font-weight="700">2. VECTOR (Math)</text>
    <!-- Bezier Curve Graphic -->
    <path d="M35 135 C 50 55, 135 55, 150 135" stroke="#22D3EE" stroke-width="4" fill="none"/>
    <line x1="35" y1="135" x2="50" y2="55" stroke="#F472B6" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="150" y1="135" x2="135" y2="55" stroke="#F472B6" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="50" cy="55" r="5" fill="#F472B6"/>
    <circle cx="135" cy="55" r="5" fill="#F472B6"/>
    <rect x="29" y="129" width="12" height="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <rect x="144" y="129" width="12" height="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <circle cx="92" cy="75" r="6" fill="#FDE047"/>
    <text x="16" y="185" fill="#CBD5E1" font-family="Prompt, sans-serif" font-size="14">• โลโก้ / ไอคอน / รูปทรง</text>
    <text x="16" y="208" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="13.5">• ย่อ-ขยายคมชัดทุกขนาด</text>
  </g>

  <!-- Bottom Banner inside Canvas -->
  <rect x="168" y="374" width="384" height="84" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="186" y="405" fill="#FDE047" font-family="Prompt, sans-serif" font-size="16" font-weight="700">กรณีศึกษา: สื่อประชาสัมพันธ์ “ร้านขนมบ้านเรา”</text>
  <text x="186" y="432" fill="#E2E8F0" font-family="Prompt, sans-serif" font-size="14.5">ใช้ภาพถ่ายขนม (Raster) + โลโก้ร้านคมชัด (Vector) ในงานเดียวกัน</text>

  <!-- Right Panel: Color Mode RGB & CMYK + File Formats -->
  <rect x="586" y="110" width="160" height="365" rx="12" fill="#0F172A" stroke="#334155"/>
  <text x="602" y="138" fill="#38BDF8" font-family="Prompt, sans-serif" font-size="15" font-weight="700">COLOR MODES</text>
  <circle cx="626" cy="178" r="18" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="650" cy="178" r="18" fill="#22C55E" fill-opacity="0.85"/>
  <circle cx="638" cy="198" r="18" fill="#3B82F6" fill-opacity="0.85"/>
  <text x="682" y="188" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">RGB</text>
  <text x="682" y="206" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="12">งานหน้าจอ</text>

  <circle cx="626" cy="252" r="16" fill="#06B6D4"/>
  <circle cx="648" cy="252" r="16" fill="#EC4899"/>
  <circle cx="637" cy="270" r="16" fill="#EAB308"/>
  <text x="676" y="260" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="700">CMYK</text>
  <text x="676" y="278" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="12">งานพิมพ์</text>

  <line x1="602" y1="305" x2="730" y2="305" stroke="#334155"/>
  <text x="602" y="330" fill="#C084FC" font-family="Prompt, sans-serif" font-size="14" font-weight="700">FILE FORMATS</text>
  <rect x="602" y="344" width="58" height="28" rx="6" fill="#2563EB"/>
  <text x="613" y="363" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">JPEG</text>
  <rect x="670" y="344" width="58" height="28" rx="6" fill="#059669"/>
  <text x="685" y="363" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">PNG</text>
  <rect x="602" y="382" width="58" height="28" rx="6" fill="#7C3AED"/>
  <text x="617" y="401" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">SVG</text>
  <rect x="670" y="382" width="58" height="28" rx="6" fill="#E11D48"/>
  <text x="685" y="401" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">PDF</text>

  <!-- Bottom Floating Feature Badges -->
  <rect x="55" y="525" width="220" height="105" rx="16" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
  <text x="78" y="562" fill="#22D3EE" font-family="Prompt, sans-serif" font-size="20" font-weight="700">Pixel &amp; 300 PPI</text>
  <text x="78" y="592" fill="#CBD5E1" font-family="Prompt, sans-serif" font-size="15">เข้าใจขนาด 1080×1080 px</text>
  <text x="78" y="614" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="14">และความละเอียดงานพิมพ์จริง</text>

  <rect x="295" y="525" width="230" height="105" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="318" y="562" fill="#C4B5FD" font-family="Prompt, sans-serif" font-size="20" font-weight="700">RGB vs CMYK</text>
  <text x="318" y="592" fill="#CBD5E1" font-family="Prompt, sans-serif" font-size="15">ผสมแสงบนจอ vs ผสมหมึกพิมพ์</text>
  <text x="318" y="614" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="14">เลือกตรงช่องทาง สีไม่เพี้ยน</text>

  <rect x="545" y="525" width="220" height="105" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="568" y="562" fill="#6EE7B7" font-family="Prompt, sans-serif" font-size="20" font-weight="700">Workshop 100 คะแนน</text>
  <text x="568" y="592" fill="#CBD5E1" font-family="Prompt, sans-serif" font-size="15">ออกแบบโฆษณา 2 แบบ</text>
  <text x="568" y="614" fill="#94A3B8" font-family="Prompt, sans-serif" font-size="14">พร้อมปรับปรุงงานจริง</text>
</svg>
