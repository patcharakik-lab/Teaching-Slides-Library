<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" fill="none">
  <rect width="900" height="420" rx="24" fill="#F8FAFF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" font-family="Prompt, sans-serif" font-size="20" font-weight="700" fill="#18243D">แผนภาพขั้นตอนการทำงานของเว็บไซต์แบบพื้นฐาน (5 ขั้นตอน)</text>

  <!-- Step 1 -->
  <g transform="translate(24, 70)">
    <rect width="154" height="240" rx="16" fill="#FFFFFF" stroke="#4778F5" stroke-width="2.5"/>
    <circle cx="77" cy="36" r="20" fill="#4778F5"/>
    <text x="77" y="43" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">1</text>
    <text x="77" y="80" text-anchor="middle" font-family="Prompt, sans-serif" font-size="15" font-weight="700" fill="#18243D">ผู้ใช้งานเปิด</text>
    <text x="77" y="102" text-anchor="middle" font-family="Prompt, sans-serif" font-size="15" font-weight="700" fill="#4778F5">เว็บเบราว์เซอร์</text>
    <rect x="14" y="118" width="126" height="48" rx="10" fill="#DDEBFF"/>
    <text x="77" y="139" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" font-weight="600" fill="#1E40AF">พิมพ์ URL เว็บร้านกาแฟ</text>
    <text x="77" y="157" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1E40AF">baancoffee.example</text>
    <rect x="14" y="176" width="126" height="48" rx="10" fill="#EDE5FF"/>
    <text x="77" y="197" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" font-weight="700" fill="#5B21B6">ค้นหาที่อยู่ผ่าน DNS</text>
    <text x="77" y="215" text-anchor="middle" font-family="Prompt, sans-serif" font-size="11.5" fill="#5B21B6">แปลงชื่อโดเมนเป็น IP</text>
  </g>

  <!-- Arrow 1->2 -->
  <path d="M182 190 H200" stroke="#4778F5" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="198,184 208,190 198,196" fill="#4778F5"/>

  <!-- Step 2 -->
  <g transform="translate(212, 70)">
    <rect width="154" height="240" rx="16" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5"/>
    <circle cx="77" cy="36" r="20" fill="#6366F1"/>
    <text x="77" y="43" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">2</text>
    <text x="77" y="80" text-anchor="middle" font-family="Prompt, sans-serif" font-size="15" font-weight="700" fill="#18243D">เบราว์เซอร์ส่งคำขอ</text>
    <text x="77" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#4F46E5">(Request)</text>
    <rect x="14" y="122" width="126" height="96" rx="10" fill="#EEF2FF"/>
    <text x="77" y="150" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="600" fill="#3730A3">ขอข้อมูลหน้าเว็บไซต์</text>
    <text x="77" y="172" text-anchor="middle" font-family="Prompt, sans-serif" font-size="13" font-weight="600" fill="#3730A3">ผ่านเครือข่ายอินเทอร์เน็ต</text>
    <text x="77" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#4F46E5">GET /menu HTTP/2</text>
  </g>

  <!-- Arrow 2->3 -->
  <path d="M370 190 H388" stroke="#6366F1" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="386,184 396,190 386,196" fill="#6366F1"/>

  <!-- Step 3 -->
  <g transform="translate(400, 70)">
    <rect width="154" height="240" rx="16" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5"/>
    <circle cx="77" cy="36" r="20" fill="#8B5CF6"/>
    <text x="77" y="43" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">3</text>
    <text x="77" y="80" text-anchor="middle" font-family="Prompt, sans-serif" font-size="15" font-weight="700" fill="#18243D">เว็บเซิร์ฟเวอร์</text>
    <text x="77" y="102" text-anchor="middle" font-family="Prompt, sans-serif" font-size="15" font-weight="700" fill="#7C3AED">รับและจัดการคำขอ</text>
    <rect x="14" y="122" width="126" height="96" rx="10" fill="#EDE5FF"/>
    <text x="77" y="148" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" font-weight="600" fill="#5B21B6">ตรวจสอบข้อมูลที่ขอ</text>
    <text x="77" y="170" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12" fill="#4C1D95">• ส่งไฟล์ที่เก็บไว้ทันที</text>
    <text x="77" y="190" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12" fill="#4C1D95">• หรือดึงจากฐานข้อมูล</text>
  </g>

  <!-- Arrow 3->4 -->
  <path d="M558 190 H576" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="574,184 584,190 574,196" fill="#8B5CF6"/>

  <!-- Step 4 -->
  <g transform="translate(588, 70)">
    <rect width="154" height="240" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="77" cy="36" r="20" fill="#10B981"/>
    <text x="77" y="43" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">4</text>
    <text x="77" y="80" text-anchor="middle" font-family="Prompt, sans-serif" font-size="15" font-weight="700" fill="#18243D">เซิร์ฟเวอร์ส่งกลับ</text>
    <text x="77" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#059669">(Response)</text>
    <rect x="14" y="122" width="126" height="96" rx="10" fill="#D5F5E8"/>
    <text x="77" y="146" text-anchor="middle" font-family="Prompt, sans-serif" font-size="12.5" font-weight="700" fill="#065F46">ส่งไฟล์ประกอบหน้าเว็บ:</text>
    <text x="77" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#047857">HTML • CSS</text>
    <text x="77" y="188" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#047857">JavaScript • รูปภาพ</text>
  </g>

  <!-- Arrow 4->5 -->
  <path d="M746 190 H756" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bottom Step 5 Full Banner -->
  <g transform="translate(24, 326)">
    <rect width="852" height="72" rx="16" fill="#18243D"/>
    <circle cx="46" cy="36" r="20" fill="#38BDF8"/>
    <text x="46" y="43" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#0F172A">5</text>
    <text x="84" y="32" font-family="Prompt, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">ขั้นตอนที่ 5: เบราว์เซอร์ประมวลผลและแสดงผลเว็บไซต์ (Browser Rendering)</text>
    <text x="84" y="54" font-family="Prompt, sans-serif" font-size="14" fill="#CBD5E1">นำไฟล์ HTML, CSS, JavaScript และรูปภาพมาแสดงบนหน้าจอ ทำให้ผู้ใช้งานเห็นเมนู รูปเครื่องดื่ม ราคา และโต้ตอบกับหน้าเว็บได้</text>
  </g>
</svg>