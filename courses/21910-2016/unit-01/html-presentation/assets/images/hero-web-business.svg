  <text x="268" y="368" fill="#A78BFA" font-family="Prompt, sans-serif" font-size="12" font-weight="700">฿ 450.-</text>

  <rect x="420" y="252" width="148" height="132" rx="10" fill="#1E293B" stroke="#334155"/>
  <rect x="432" y="264" width="124" height="64" rx="6" fill="#10B981" opacity="0.35"/>
  <text x="432" y="348" fill="#F8FAFC" font-family="Prompt, sans-serif" font-size="13" font-weight="600">บริการจัดส่งด่วน</text>
  <text x="432" y="368" fill="#34D399" font-family="Prompt, sans-serif" font-size="12" font-weight="700">ฟรีค่าส่ง</text>

