  <text x="490" y="100" fill="#78350F" font-family="Prompt, sans-serif" font-size="14" font-weight="600">หน้าแรก  |  เมนูเครื่องดื่ม  |  เรื่องราวร้าน  |  ติดต่อเรา</text>

  <!-- Hero Banner -->
  <rect x="40" y="128" width="720" height="106" rx="10" fill="#78350F"/>
  <text x="68" y="166" fill="#FEF3C7" font-family="Prompt, sans-serif" font-size="22" font-weight="700">กาแฟคั่วสดหอมกรุ่นจากชุมชน สั่งล่วงหน้าไม่ต้องรอคิว</text>
  <text x="68" y="192" fill="#FDE68A" font-family="Prompt, sans-serif" font-size="14">คัดสรรเมล็ดกาแฟคุณภาพ ชงสดแก้วต่อแก้ว พร้อมบริการสั่งออนไลน์และชำระเงินปลอดภัย</text>
  <rect x="68" y="202" width="140" height="24" rx="12" fill="#F59E0B"/>
  <text x="138" y="218" text-anchor="middle" fill="#0F172A" font-family="Prompt, sans-serif" font-size="12" font-weight="700">สั่งเครื่องดื่มเลย</text>

  <!-- Menu Cards -->
  <rect x="40" y="246" width="228" height="122" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="60" y="276" fill="#92400E" font-family="Prompt, sans-serif" font-size="16" font-weight="700">1. เอสเปรสโซ่เย็น</text>
  <text x="60" y="300" fill="#475569" font-family="Prompt, sans-serif" font-size="13">เข้มข้น หอมมัน สูตรซิกเนเจอร์</text>
  <text x="60" y="328" fill="#D97706" font-family="Prompt, sans-serif" font-size="16" font-weight="700">ราคา 55 บาท</text>

  <rect x="286" y="246" width="228" height="122" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="306" y="276" fill="#92400E" font-family="Prompt, sans-serif" font-size="16" font-weight="700">2. มัทฉะลาเต้นมสด</text>
  <text x="306" y="300" fill="#475569" font-family="Prompt, sans-serif" font-size="13">ชาเขียวแท้เกรดพรีเมียม นุ่มละมุน</text>
  <text x="306" y="328" fill="#D97706" font-family="Prompt, sans-serif" font-size="16" font-weight="700">ราคา 65 บาท</text>

  <rect x="532" y="246" width="228" height="122" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="552" y="276" fill="#1E40AF" font-family="Prompt, sans-serif" font-size="16" font-weight="700">📍 ข้อมูลติดต่อ &amp; แผนที่</text>
  <text x="552" y="300" fill="#334155" font-family="Prompt, sans-serif" font-size="13">เปิดทุกวัน 07:00 - 18:00 น.</text>
  <text x="552" y="324" fill="#2563EB" font-family="Prompt, sans-serif" font-size="14" font-weight="700">โทร: 08x-xxx-xxxx</text>

  <!-- Footer -->
  <rect x="40" y="378" width="720" height="38" rx="8" fill="#0F172A"/>
  <text x="400" y="402" text-anchor="middle" fill="#CBD5E1" font-family="Prompt, sans-serif" font-size="13">© Baan Coffee ชุมชน • รองรับทั้งคอมพิวเตอร์และสมาร์ตโฟน (Responsive Design)</text>
</svg>
